# ================================================================
# Netlify-konfigurasjon for Tidsbrev.no
# ================================================================
# Denne filen forteller Netlify hvordan siden skal bygges og hvor
# backend-funksjonene ligger. Legg den i rotmappen av prosjektet.
# ================================================================

[build]
  # Mappen som skal publiseres (rotmappen siden vi bruker ren HTML)
  publish = "."

  # Mappen hvor Netlify Functions (serverless backend) ligger
  functions = "backend"

  # Ingen build-kommando siden vi bruker ren HTML/CSS/JS
  command = "echo 'Ingen build trengs — ren HTML/CSS/JS'"

# ----------------------------------------------------------------
# Functions-innstillinger
# ----------------------------------------------------------------
[functions]
  # Node-versjon som brukes til å kjøre backend-funksjonene
  node_bundler = "esbuild"
  # Inkluder eventuelle eksterne moduler hvis nødvendig
  external_node_modules = ["stripe", "@supabase/supabase-js", "resend"]

# ----------------------------------------------------------------
# Redirects — gjør det enklere å kalle funksjonene fra frontend
# Eksempel: fetch('/api/stripe-webhook') blir til /.netlify/functions/stripe-webhook
# ----------------------------------------------------------------
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# ----------------------------------------------------------------
# Sikkerhets-headers
# ----------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# ----------------------------------------------------------------
# Cache for statiske filer (CSS, JS, bilder)
# ----------------------------------------------------------------
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ----------------------------------------------------------------
# Scheduled Functions (cron-jobber)
# ----------------------------------------------------------------
# send-brev kjører daglig kl 07:00 UTC (09:00 norsk tid)
# og sender ut alle digitale brev som har leveringsdato i dag,
# pluss admin-påminnelse om fysiske brev innen 30 dager.
[functions."send-brev"]
  schedule = "0 7 * * *"

# ----------------------------------------------------------------
# Miljøvariabler settes i Netlify-dashbordet under
# Site settings → Environment variables
# ----------------------------------------------------------------
# SUPABASE_URL
# SUPABASE_SERVICE_ROLE_KEY
# SIDE_URL                   (f.eks. https://tidsbrev.no)
#
# STRIPE_SECRET_KEY          (sk_test_... eller sk_live_...)
# STRIPE_WEBHOOK_SECRET      (whsec_...)
#
# VIPPS_CLIENT_ID
# VIPPS_CLIENT_SECRET
# VIPPS_SUBSCRIPTION_KEY
# VIPPS_MSN
# VIPPS_MILJO                (test eller production)
# VIPPS_WEBHOOK_SECRET
#
# RESEND_API_KEY              (re_... fra resend.com/api-keys)
# EPOST_AVSENDER              ("Tidsbrev <hei@tidsbrev.no>" — domenet må være verifisert i Resend)
# ADMIN_EPOST                 (din private admin-epostadresse for interne varsler)
